    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operators</title>

<body>
    


    <script>
        // addition
        console.log(5+6);
        // concatenation
        console.log('5'+'6');
        console.log(5*8);

        console.log(3 == 4);
        console.log(3 != 4);
        
        
        
    </script>
